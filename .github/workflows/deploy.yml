name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  PROJECT_ID: koinoflow-infra
  PROJECT_NUMBER: "557517254312"
  REGION: europe-west1
  ARTIFACT_REPOSITORY: koinoflow
  FRONTEND_BUCKET: gs://koinoflow-frontend
  BACKEND_SERVICE: koinoflow-backend
  MCP_SERVICE: koinoflow-mcp
  MIGRATION_JOB: koinoflow-migrate
  CLOUD_TASKS_QUEUE: koinoflow-tasks
  CLOUD_TASKS_SERVICE_ACCOUNT: koinoflow-tasks-invoker@koinoflow-infra.iam.gserviceaccount.com
  SKILL_EXECUTOR_JOB: koinoflow-skill-executor
  SKILL_EXECUTOR_SERVICE_ACCOUNT: koinoflow-skill-executor@koinoflow-infra.iam.gserviceaccount.com
  SKILL_RUNS_BUCKET: gs://koinoflow-skill-runs

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deploy@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push backend image
        run: |
          set -euo pipefail
          image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/backend:${GITHUB_SHA}"
          latest="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/backend:latest"

          docker build \
            --tag "${image}" \
            --tag "${latest}" \
            ./backend

          docker push "${image}"
          docker push "${latest}"

          echo "BACKEND_IMAGE=${image}" >> "${GITHUB_ENV}"

      - name: Build and push MCP image
        run: |
          set -euo pipefail
          image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/mcp-server:${GITHUB_SHA}"
          latest="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/mcp-server:latest"

          docker build \
            --tag "${image}" \
            --tag "${latest}" \
            ./mcp-server

          docker push "${image}"
          docker push "${latest}"

          echo "MCP_IMAGE=${image}" >> "${GITHUB_ENV}"

      - name: Build and push skill executor image
        run: |
          set -euo pipefail
          image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/skill-executor:${GITHUB_SHA}"
          latest="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/skill-executor:latest"

          docker build \
            --tag "${image}" \
            --tag "${latest}" \
            ./skill-executor

          docker push "${image}"
          docker push "${latest}"

          echo "SKILL_EXECUTOR_IMAGE=${image}" >> "${GITHUB_ENV}"

      - name: Run database migrations
        run: |
          set -euo pipefail

          gcloud run jobs update "${MIGRATION_JOB}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${BACKEND_IMAGE}"

          gcloud run jobs execute "${MIGRATION_JOB}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --wait

      - name: Ensure Cloud Tasks queue
        run: |
          set -euo pipefail

          if ! gcloud tasks queues describe "${CLOUD_TASKS_QUEUE}" \
            --project="${PROJECT_ID}" \
            --location="${REGION}" >/dev/null 2>&1; then
            gcloud tasks queues create "${CLOUD_TASKS_QUEUE}" \
              --project="${PROJECT_ID}" \
              --location="${REGION}" \
              --max-dispatches-per-second=10 \
              --max-concurrent-dispatches=10 \
              --max-attempts=5
          fi

      - name: Ensure skill execution infrastructure
        run: |
          set -euo pipefail

          if ! gcloud storage buckets describe "${SKILL_RUNS_BUCKET}" \
            --project="${PROJECT_ID}" >/dev/null 2>&1; then
            gcloud storage buckets create "${SKILL_RUNS_BUCKET}" \
              --project="${PROJECT_ID}" \
              --location="${REGION}" \
              --uniform-bucket-level-access
          fi

          lifecycle="$(mktemp)"
          cat > "${lifecycle}" <<'EOF'
          {
            "rule": [
              {
                "action": {"type": "Delete"},
                "condition": {"age": 30}
              }
            ]
          }
          EOF
          gcloud storage buckets update "${SKILL_RUNS_BUCKET}" \
            --project="${PROJECT_ID}" \
            --lifecycle-file="${lifecycle}"

          if ! gcloud run jobs describe "${SKILL_EXECUTOR_JOB}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" >/dev/null 2>&1; then
            gcloud run jobs create "${SKILL_EXECUTOR_JOB}" \
              --project="${PROJECT_ID}" \
              --region="${REGION}" \
              --image="${SKILL_EXECUTOR_IMAGE}" \
              --service-account="${SKILL_EXECUTOR_SERVICE_ACCOUNT}" \
              --max-retries=0 \
              --task-timeout=300 \
              --memory=512Mi \
              --cpu=1
          else
            gcloud run jobs update "${SKILL_EXECUTOR_JOB}" \
              --project="${PROJECT_ID}" \
              --region="${REGION}" \
              --image="${SKILL_EXECUTOR_IMAGE}" \
              --service-account="${SKILL_EXECUTOR_SERVICE_ACCOUNT}" \
              --max-retries=0 \
              --task-timeout=300 \
              --memory=512Mi \
              --cpu=1
          fi

          echo "::notice::Skill execution IAM must allow the backend runtime service account to run ${SKILL_EXECUTOR_JOB} and write ${SKILL_RUNS_BUCKET}."
          echo "::notice::The executor service account ${SKILL_EXECUTOR_SERVICE_ACCOUNT} must be able to read/write ${SKILL_RUNS_BUCKET}."

      - name: Deploy Cloud Run services
        run: |
          set -euo pipefail

          backend_secrets="SECRET_KEY=DJANGO_SECRET_KEY:latest"
          backend_secrets+=",DATABASE_URL=DATABASE_URL:latest"
          backend_secrets+=",REDIS_URL=REDIS_URL:latest"
          backend_secrets+=",GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest"
          backend_secrets+=",GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest"
          backend_secrets+=",GITHUB_CLIENT_ID=GITHUB_CLIENT_ID:latest"
          backend_secrets+=",GITHUB_CLIENT_SECRET=GITHUB_CLIENT_SECRET:latest"
          backend_secrets+=",ATLASSIAN_CLIENT_ID=ATLASSIAN_CLIENT_ID:latest"
          backend_secrets+=",ATLASSIAN_CLIENT_SECRET=ATLASSIAN_CLIENT_SECRET:latest"
          backend_secrets+=",ATLASSIAN_WEBHOOK_SECRET=ATLASSIAN_WEBHOOK_SECRET:latest"
          backend_secrets+=",CONNECTOR_ENCRYPTION_KEY=CONNECTOR_ENCRYPTION_KEY:latest"
          backend_secrets+=",RESEND_API_KEY=RESEND_API_KEY:latest"
          backend_secrets+=",INTERNAL_TASK_TOKEN=INTERNAL_TASK_TOKEN:latest"
          backend_secrets+=",MCP_INTROSPECT_CLIENT_ID=MCP_INTROSPECT_CLIENT_ID:latest"
          backend_secrets+=",MCP_INTROSPECT_CLIENT_SECRET=MCP_INTROSPECT_CLIENT_SECRET:latest"
          backend_secrets+=",CAPTURE_SCORING_MODEL=CAPTURE_SCORING_MODEL:latest"
          backend_secrets+=",CAPTURE_EXTRACTION_MODEL=CAPTURE_EXTRACTION_MODEL:latest"
          backend_secrets+=",PROCESS_GENERATION_MODEL=PROCESS_GENERATION_MODEL:latest"
          backend_secrets+=",VERTEX_PROJECT_ID=VERTEX_PROJECT_ID:latest"
          backend_secrets+=",VERTEX_LOCATION=VERTEX_LOCATION:latest"
          backend_secrets+=",VERTEX_CLIENT_PROJECT_ID=VERTEX_CLIENT_PROJECT_ID:latest"
          backend_secrets+=",VERTEX_CLIENT_PRIVATE_KEY_ID=VERTEX_CLIENT_PRIVATE_KEY_ID:latest"
          backend_secrets+=",VERTEX_CLIENT_PRIVATE_KEY=VERTEX_CLIENT_PRIVATE_KEY:latest"
          backend_secrets+=",VERTEX_CLIENT_EMAIL=VERTEX_CLIENT_EMAIL:latest"
          backend_secrets+=",VERTEX_CLIENT_ID=VERTEX_CLIENT_ID:latest"
          backend_secrets+=",VERTEX_CLIENT_CERT_URL=VERTEX_CLIENT_CERT_URL:latest"
          backend_secrets+=",SKILL_EXECUTION_CALLBACK_SECRET=SKILL_EXECUTION_CALLBACK_SECRET:latest"

          backend_env_vars="TASK_BACKEND=cloudtasks"
          backend_env_vars+=",CLOUD_TASKS_PROJECT=${PROJECT_ID}"
          backend_env_vars+=",CLOUD_TASKS_LOCATION=${REGION}"
          backend_env_vars+=",CLOUD_TASKS_QUEUE=${CLOUD_TASKS_QUEUE}"
          backend_env_vars+=",CLOUD_TASKS_SERVICE_URL=https://app.koinoflow.com"
          backend_env_vars+=",CLOUD_TASKS_SERVICE_ACCOUNT=${CLOUD_TASKS_SERVICE_ACCOUNT}"
          backend_env_vars+=",SKILL_EXECUTION_BACKEND=cloud_run_jobs"
          backend_env_vars+=",SKILL_EXECUTION_GCP_PROJECT=${PROJECT_ID}"
          backend_env_vars+=",SKILL_EXECUTION_GCP_LOCATION=${REGION}"
          backend_env_vars+=",SKILL_EXECUTION_CLOUD_RUN_JOB=${SKILL_EXECUTOR_JOB}"
          backend_env_vars+=",SKILL_EXECUTION_RUNS_BUCKET=${SKILL_RUNS_BUCKET}"
          backend_env_vars+=",SKILL_EXECUTION_PUBLIC_BASE_URL=https://app.koinoflow.com"

          gcloud run services update "${BACKEND_SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${BACKEND_IMAGE}" \
            --update-env-vars="${backend_env_vars}" \
            --update-secrets="${backend_secrets}"

          gcloud run services update "${MCP_SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --image="${MCP_IMAGE}"

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_MCP_SERVER_URL: https://mcp.koinoflow.com
          VITE_PRICING_URL: ${{ vars.VITE_PRICING_URL }}
          VITE_SALES_CONTACT_URL: ${{ vars.VITE_SALES_CONTACT_URL }}
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Publish frontend bucket
        run: |
          set -euo pipefail
          gcloud storage rsync frontend/dist "${FRONTEND_BUCKET}" --recursive --delete-unmatched-destination-objects
